server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip compression for text assets
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Health endpoint for k8s probes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # content.json must never be cached (loader appends ?v= but be explicit)
    location = /content.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Long cache for static media assets
    location ~* \.(?:png|jpe?g|gif|webp|svg|mp4|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML/JS: revalidate frequently
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Default: serve file, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
