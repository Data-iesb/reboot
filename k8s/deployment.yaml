apiVersion: v1
kind: Namespace
metadata:
  name: reboot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reboot
  namespace: reboot
  labels:
    app: reboot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reboot
  template:
    metadata:
      labels:
        app: reboot
    spec:
      containers:
        - name: reboot
          image: 248189947068.dkr.ecr.us-east-1.amazonaws.com/reboot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: 80
            failureThreshold: 12
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reboot
  namespace: reboot
  labels:
    app: reboot
spec:
  type: ClusterIP
  selector:
    app: reboot
  ports:
    - port: 80
      targetPort: 80
